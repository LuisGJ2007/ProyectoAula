<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Personas</title></head>
<body>
    <h1>Personas</h1>
    <a th:href="@{/personas/nueva}">Agregar persona</a>

    <table>
        <tr>
            <th>Nombre</th><th>Apellido</th><th>Correo</th><th>Estado</th>
        </tr>
        <tr th:each="p : ${personas}">
            <td th:text="${p.nombre}"></td>
            <td th:text="${p.apellido}"></td>
            <td th:text="${p.correo}"></td>
            <td th:text="${p.estadoDeUsuario}"></td>
        </tr>
    </table>

    <p th:if="${#lists.isEmpty(personas)}">No hay registros.</p>
</body>
</html>
